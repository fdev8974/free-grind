extends:
  - node_modules/@opengrind/config/lefthook.yml

pre-commit:
  commands:
    clippy:
      glob: "*.rs"
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR cargo clippy --all-targets
    rust-test:
      glob: "*.rs"
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR cargo test --quiet
