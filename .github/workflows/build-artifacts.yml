name: Build Artifacts (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_suffix: macos-universal
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: windows-2025
            args: --bundles nsis
            rust_targets: ""
            artifact_suffix: windows-x64
            bundle_dir: src-tauri/target/release/bundle
          - platform: ubuntu-24.04
            args: --bundles deb,rpm,appimage
            rust_targets: ""
            artifact_suffix: linux-x64
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # src-tauri/vendor/freegrind-google-oauth-webextension (desktop Google sign-in)
          submodules: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
          # build.rs fails instead of shipping without the Linux video extension
          echo "FG_REQUIRE_MEDIA_EXTENSION=1" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Rust
        env:
          TARGETS: ${{ matrix.rust_targets }}
        shell: bash
        run: |
          rustup toolchain install
          [ -z "$TARGETS" ] || rustup target add ${TARGETS//,/ }

      - name: Check Cargo.lock is up to date
        # Fails instead of letting the build silently re-resolve crate versions.
        shell: bash
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          tauriScript: bunx tauri
          args: ${{ matrix.args }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: free-grind-${{ matrix.artifact_suffix }}
          path: |
            ${{ matrix.bundle_dir }}
          retention-days: 14
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # src-tauri/vendor/freegrind-google-oauth-webextension (Google sign-in,
          # bundled into the APK for GoogleOAuthActivity)
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Default is "tools platform-tools"; the legacy `tools` package no longer exists.
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.14206865"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - name: Check Cargo.lock is up to date
        # Fails instead of letting the build silently re-resolve crate versions.
        shell: bash
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Initialize Android project
        run: bunx tauri android init --ci --skip-targets-install

      - name: Ensure Android network security config
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/res/xml
          cat > src-tauri/gen/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      - name: Add custom Android notification sound
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/res/raw
          install -m 0644 src-tauri/sounds/free_grind_message.mp3 src-tauri/gen/android/app/src/main/res/raw/free_grind_message.mp3

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p src-tauri/certs
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/certs/free-grind-dev.jks

      # arm64-v8a only, like release.yml.
      - name: Build Android APK
        run: bunx tauri android build --apk --split-per-abi --target aarch64 -v

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: free-grind-android
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
          retention-days: 14
          if-no-files-found: error

  build-ios:
    uses: ./.github/workflows/build-ios.yml
