name: Publish OTA Branches

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      channel:
        description: "OTA channel to publish"
        required: true
        default: "development"

permissions:
  contents: read

concurrency:
  group: ota-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve OTA metadata
        id: ota-meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            channel="${{ github.event.inputs.channel }}"
          else
            case "${GITHUB_REF_NAME}" in
              development)
                channel="development"
                ;;
              *)
                echo "Unsupported branch for OTA: ${GITHUB_REF_NAME}" >&2
                exit 1
                ;;
            esac
          fi

          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish OTA bundle to surge.sh
        env:
          HOTSWAP_PRIVATE_KEY: ${{ secrets.HOTSWAP_PRIVATE_KEY }}
          HOTSWAP_PRIVATE_KEY_PASSWORD: ${{ secrets.HOTSWAP_PRIVATE_KEY_PASSWORD }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          OTA_NOTES: Automated OTA upload for ${{ github.sha }} on ${{ steps.ota-meta.outputs.channel }}
        run: bun run scripts/publish-ota.mjs --channel "${{ steps.ota-meta.outputs.channel }}"
