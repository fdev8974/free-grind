name: Release

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # main releases on every push. development only releases when a push changes
  # the version to a pre-release (`bun run set-version beta`) AND native code
  # changed since the last binary. Frontend-only versions reach every installed
  # app over OTA (ota-branches.yml), so a new APK would add nothing.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(jq -r '.version' package.json)
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF_NAME" == "main" ]]; then
            should_release=true
          elif [[ "$version" != *-* ]]; then
            echo "$version is not a pre-release, skipping"
            should_release=false
          else
            # A new branch has no previous commit (all zeros): treat as changed.
            previous=$(git show "$BEFORE:package.json" 2>/dev/null | jq -r '.version' || true)
            if [[ "$previous" == "$version" ]]; then
              echo "Version unchanged ($version), skipping"
              should_release=false
            else
              echo "Version changed ${previous:-none} -> $version"
              # Same rule as the OTA manifest: if the oldest compatible binary is
              # older than this version, existing apps get it over OTA.
              min_binary=$(node scripts/min-binary-version.mjs)
              if [[ "$min_binary" == "$version" ]]; then
                echo "Native code changed since the last binary, releasing"
                should_release=true
              else
                echo "Frontend-only since $min_binary, OTA covers it, skipping the APK release"
                should_release=false
              fi
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  create-release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
      release_name: ${{ steps.vars.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release metadata
        id: vars
        run: |
          echo "package_version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # Versions like 1.0.0-beta.0 become GitHub pre-releases. The in-app
          # update prompt only offers those on non-stable update channels.
          if [[ "$(jq -r '.version' package.json)" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_name=Free Grind v$(jq -r '.version' package.json) (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.vars.outputs.tag_name }}',
              // Without this the tag lands on the default branch's HEAD, which
              // is wrong for manual runs from another branch (e.g. development).
              target_commitish: context.sha,
              name: '${{ steps.vars.outputs.release_name }}',
              body: [
                'Automated release generated from `${{ github.ref_name }}`.',
                '',
                `Commit: ${context.sha}`
              ].join('\n'),
              draft: true,
              prerelease: ${{ steps.vars.outputs.prerelease }},
              generate_release_notes: true
            });
            core.setOutput('release_id', String(data.id));

  publish-ota:
    needs: create-release
    # Pushes to other branches already publish their OTA via ota-branches.yml;
    # a second deploy of the same commit would just race it.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # History lets publish-ota.mjs find the oldest compatible binary.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign and publish OTA bundle to surge.sh
        id: ota-upload
        env:
          HOTSWAP_PRIVATE_KEY: ${{ secrets.HOTSWAP_PRIVATE_KEY }}
          HOTSWAP_PRIVATE_KEY_PASSWORD: ${{ secrets.HOTSWAP_PRIVATE_KEY_PASSWORD }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          OTA_NOTES: Automated OTA upload for ${{ github.sha }}
        run: bun run scripts/publish-ota.mjs --channel main

      - name: Upload OTA artifacts to GitHub release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          OTA_VERSION: ${{ steps.ota-upload.outputs.ota_version }}
        with:
          script: |
            const fs = require('fs');

            const files = [
              {
                path: 'frontend.tar.gz',
                name: `frontend-${process.env.OTA_VERSION}.tar.gz`,
                contentType: 'application/gzip'
              },
              {
                path: 'frontend.tar.gz.sig',
                name: `frontend-${process.env.OTA_VERSION}.tar.gz.sig`,
                contentType: 'text/plain'
              }
            ];

            for (const file of files) {
              const data = fs.readFileSync(file.path);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: Number(process.env.RELEASE_ID),
                name: file.name,
                data,
                headers: {
                  'content-type': file.contentType,
                  'content-length': data.length
                }
              });
            }

  build-desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_suffix: macos-universal
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: windows-latest
            args: --bundles nsis
            rust_targets: ""
            artifact_suffix: windows-x64
            bundle_dir: src-tauri/target/release/bundle
          - platform: ubuntu-latest
            args: --bundles deb,rpm,appimage
            rust_targets: ""
            artifact_suffix: linux-x64
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.platform }}
    env:
      # Default update channel baked into the frontend: builds from main ship
      # on Stable, every other branch (beta builds) on Development.
      VITE_HOTSWAP_CHANNEL: ${{ github.ref_name == 'main' && 'main' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # src-tauri/vendor/freegrind-google-oauth-webextension (desktop Google sign-in)
          submodules: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bunx tauri
          args: ${{ matrix.args }}

      - name: Upload desktop artifacts to release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const os = require('os');
            const { execFileSync } = require('child_process');

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.version;
            const suffix = process.env.ARTIFACT_SUFFIX;
            let bundleDir = process.env.BUNDLE_DIR;
            const releaseId = Number(process.env.RELEASE_ID);

            // Resolve bundleDir to absolute path for debugging
            if (!path.isAbsolute(bundleDir)) {
              bundleDir = path.resolve(bundleDir);
            }

            const mimeTypes = {
              '.dmg':         'application/x-apple-diskimage',
              '.gz':          'application/gzip',
              '.tar.gz':      'application/gzip',
              '.tar.gz.sig':  'text/plain',
              '.sig':         'text/plain',
              '.exe':         'application/vnd.microsoft.portable-executable',
              '.exe.sig':     'text/plain',
              '.deb':         'application/vnd.debian.binary-package',
              '.deb.sig':     'text/plain',
              '.rpm':         'application/x-rpm',
              '.rpm.sig':     'text/plain',
              '.AppImage':     'application/vnd.appimage',
              '.AppImage.sig': 'text/plain',
            };

            // Collect installable bundles
            const searchDirs = {
              'macos-universal': ['dmg', 'macos'],
              'windows-x64':     ['nsis'],
              'linux-x64':       ['deb', 'rpm', 'appimage'],
            };

            const subDirs = searchDirs[suffix] ?? [];
            const uploads = [];
            // Ordered longest-first so multi-part extensions are matched before shorter ones
            const allowedExts = ['.tar.gz.sig', '.tar.gz', '.exe.sig', '.AppImage.sig', '.deb.sig', '.rpm.sig', '.dmg', '.exe', '.deb', '.rpm', '.AppImage'];

            function addUpload(src, assetName, mime) {
              uploads.push({ src, name: assetName, mime });
            }

            function versionedAssetName(baseName) {
              return `free-grind-v${version}-${suffix}-${baseName}`;
            }

            function hasAnyBundleSubdir(dir) {
              if (!fs.existsSync(dir)) return false;
              return subDirs.some((sub) => fs.existsSync(path.join(dir, sub)));
            }

            function resolveBundleDir() {
              const candidates = [bundleDir];

              // Tauri can place bundle outputs in different target layouts depending on host/build settings.
              if (suffix === 'macos-universal') {
                candidates.push(
                  'src-tauri/target/release/bundle',
                  'src-tauri/target/universal-apple-darwin/release/bundle',
                  'src-tauri/target/aarch64-apple-darwin/release/bundle',
                  'src-tauri/target/x86_64-apple-darwin/release/bundle'
                );
              }

              const resolved = candidates
                .filter(Boolean)
                .map((c) => (path.isAbsolute(c) ? c : path.resolve(c)));

              for (const candidate of resolved) {
                if (hasAnyBundleSubdir(candidate)) {
                  return candidate;
                }
              }

              // Prefer the first existing directory even if expected subdirs are missing for better diagnostics.
              const firstExisting = resolved.find((c) => fs.existsSync(c));
              return firstExisting || resolved[0];
            }

            bundleDir = resolveBundleDir();

            console.log(`📦 Artifact search: suffix=${suffix}, bundleDir=${bundleDir}`);
            console.log(`   bundleDir exists: ${fs.existsSync(bundleDir)}`);
            console.log(`📂 Searching subdirs: ${subDirs.join(', ')}`);

            for (const sub of subDirs) {
              const dir = path.join(bundleDir, sub);
              console.log(`  Checking: ${dir}`);
              if (!fs.existsSync(dir)) {
                console.log(`    ❌ Does not exist`);
                continue;
              }
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              console.log(`    ✓ Found ${entries.length} entries`);
              
              for (const entry of entries) {
                console.log(`      - ${entry.name} (${entry.isDirectory() ? 'dir' : 'file'})`);
                
                // On macOS, Tauri may output a .app directory without a DMG.
                // Zip that directory so we always publish a runnable desktop artifact.
                if (suffix === 'macos-universal' && entry.isDirectory() && entry.name.endsWith('.app')) {
                  const appPath = path.join(dir, entry.name);
                  const zipPath = path.join(os.tmpdir(), `${entry.name}.zip`);
                  console.log(`        ↻ Zipping .app bundle: ${zipPath}`);
                  if (fs.existsSync(zipPath)) fs.rmSync(zipPath, { force: true });
                  try {
                    execFileSync('/usr/bin/ditto', ['-c', '-k', '--sequesterRsrc', '--keepParent', appPath, zipPath]);
                    addUpload(zipPath, versionedAssetName(`${entry.name}.zip`), 'application/zip');
                    console.log(`        ✓ Zipped and queued`);
                  } catch (e) {
                    console.log(`        ⚠ Failed to zip: ${e.message}`);
                  }
                  continue;
                }

                if (!entry.isFile()) {
                  console.log(`        ⊘ Skipping directory`);
                  continue;
                }
                
                const file = entry.name;
                const finalExt = allowedExts.find(e => file.endsWith(e));
                if (!finalExt) {
                  console.log(`        ⊘ Extension not in allowlist`);
                  continue;
                }
                
                const mime = mimeTypes[finalExt] ?? 'application/octet-stream';
                addUpload(path.join(dir, file), versionedAssetName(file), mime);
                console.log(`        ✓ Queued as ${versionedAssetName(file)}`);
              }
            }

            // Publish portable role-specific binaries for Windows.
            // Runtime mode is selected by executable filename (manager vs child/client).
            if (suffix === 'windows-x64') {
              const baseExe = path.join('src-tauri', 'target', 'release', 'free-grind.exe');
              if (fs.existsSync(baseExe)) {
                addUpload(baseExe, `free-grind-manager-v${version}-${suffix}.exe`, mimeTypes['.exe']);
                addUpload(baseExe, `free-grind-client-v${version}-${suffix}.exe`, mimeTypes['.exe']);
                // Keep a child alias for compatibility with older automation.
                addUpload(baseExe, `free-grind-child-v${version}-${suffix}.exe`, mimeTypes['.exe']);
                console.log(`  ✓ Windows portables queued`);
              } else {
                console.log(`  ❌ Windows executable not found: ${baseExe}`);
              }
            }

            // Fallback for macOS: if bundling didn't emit dmg/macos folders,
            // still publish the universal executable as a compressed artifact.
            if (suffix === 'macos-universal' && uploads.length === 0) {
              const baseBinary = path.resolve('src-tauri/target/universal-apple-darwin/release/free-grind');
              if (fs.existsSync(baseBinary)) {
                const fallbackTar = path.join(os.tmpdir(), `free-grind-v${version}-${suffix}-binary.tar.gz`);
                if (fs.existsSync(fallbackTar)) fs.rmSync(fallbackTar, { force: true });
                execFileSync('/usr/bin/tar', ['-czf', fallbackTar, '-C', path.dirname(baseBinary), path.basename(baseBinary)]);
                addUpload(fallbackTar, `free-grind-v${version}-${suffix}-binary.tar.gz`, 'application/gzip');
                console.log(`  ✓ Added macOS binary fallback artifact from ${baseBinary}`);
              } else {
                console.log(`  ❌ macOS fallback binary not found at ${baseBinary}`);
              }
            }

            console.log(`\n📋 Total artifacts queued: ${uploads.length}`);
            if (uploads.length === 0) {
              console.log(`\nDebug: Listing actual bundle directory structure:`);
              if (fs.existsSync(bundleDir)) {
                const allEntries = fs.readdirSync(bundleDir, { recursive: true, withFileTypes: false });
                allEntries.slice(0, 30).forEach(e => console.log(`  ${e}`));
              }
              throw new Error(`No desktop artifacts found for ${suffix} under ${bundleDir}`);
            }

            for (const { src, name, mime } of uploads) {
              const data = fs.readFileSync(src);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name,
                data,
                headers: { 'content-type': mime, 'content-length': data.length },
              });
              console.log(`✓ Uploaded ${name}`);
            }

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      # Default update channel baked into the frontend: builds from main ship
      # on Stable, every other branch (beta builds) on Development.
      VITE_HOTSWAP_CHANNEL: ${{ github.ref_name == 'main' && 'main' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # src-tauri/vendor/freegrind-google-oauth-webextension (Google sign-in,
          # bundled into the APK for GoogleOAuthActivity)
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools"; the legacy `tools` package no longer exists.
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.14206865"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Initialize Android project
        run: bunx tauri android init --ci --skip-targets-install

      - name: Ensure Android network security config
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/res/xml
          cat > src-tauri/gen/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      - name: Add custom Android notification sound
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/res/raw
          install -m 0644 src-tauri/sounds/free_grind_message.mp3 src-tauri/gen/android/app/src/main/res/raw/free_grind_message.mp3

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p src-tauri/certs
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/certs/free-grind-dev.jks

      # arm64-v8a only: GeckoView (Google sign-in) adds ~85 MB per ABI, and
      # 32-bit or x86 phones are practically extinct.
      - name: Build Android APK
        run: bunx tauri android build --apk --split-per-abi --target aarch64 -v

      - name: Upload Android APK to release
        uses: actions/github-script@v8
        env:
          RELEASE_NAME: ${{ needs.create-release.outputs.release_name }}
          PACKAGE_VERSION: ${{ needs.create-release.outputs.tag_name }}
        with:
          script: |
            const fs = require('fs');
            const apkPath = 'src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk';

            if (!fs.existsSync(apkPath)) {
              throw new Error(`APK not found at ${apkPath}`);
            }

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.version;
            const apkName = `free-grind-v${version}.apk`;

            const fileData = fs.readFileSync(apkPath);

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: apkName,
              data: fileData,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': fileData.length
              }
            });

            console.log(`✓ APK uploaded to release as ${apkName}`);

  build-ios:
    needs: create-release
    uses: ./.github/workflows/build-ios.yml
    with:
      release_id: ${{ needs.create-release.outputs.release_id }}
